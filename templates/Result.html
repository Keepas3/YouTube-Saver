<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Youtube Saver</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Legend.png') }}">
    <link rel="stylesheet" href="/css/styles.css">

    <style>

.result-page {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
}

.result-page .container {
    text-align: center;
    padding: 1rem;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.result-page .container button[type="button"] {
    padding: 10px 20px;
    border-radius: 5px;
    border: none;
    background-color: #4285f4;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 20px;
    transition: background-color 0.3s;
}

.result-page .container button[type="button"]:hover {
    background-color: #8b8be3;
}

.result-page .container h1 {
    font-size: 36px;
    color: #ffcc00;
    margin-bottom: 20px;
}
.result-page .result-message {
    border: 1px solid #9c9999;
    border-radius: 5px;
    padding: 1rem;
    margin: 1rem 0;
}

.result-page .google-drive-link img {
    width: 80px; /* Adjust size as needed */
    height: 80px;
    cursor: pointer;
}
    </style>
</head>
<body class = "result-page">
    <div class="container">
        <h1>Conversion Results:</h1>
        <hr>
        <div class="result-message" id="resultMessage"></div>
        <p>
            <button type="button" onclick="backToHomePage()">Back to Home Page</button>
        </p>
    <br><br>
    <p class="google-drive-link">
        <a href = "https://drive.google.com/" target ="_blank"> 
            <img src="{{ url_for('static', filename='images/Google_Drive.png')}}" alt ="Google Drive">
         </a>
    </p>
</div>
    <script>
        function backToHomePage() {
            window.location.href = "/";
        }
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('message');
            if(message) {
                document.getElementById('resultMessage').innerText = message;
            } else {
                document.getElementById('resultMessage').innerText = "No message provided";
            }
        });
    </script>
</body>
</html>
